<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IntelliVNG Standalone Player</title>
    <style>
        :root {
            --primary-color: #4f46e5;
            --text-color: #1f2937;
            --bg-color: #f3f4f6;
            --box-bg: rgba(0, 0, 0, 0.8);
            --name-bg: #4f46e5;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #app {
            width: 100%;
            height: 100%;
            position: relative;
            background-color: #000;
        }

        /* 上传界面 - 仅在无内嵌数据时显示 */
        #upload-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: white;
            z-index: 100;
        }

        .upload-box {
            padding: 2rem;
            border: 2px dashed #ccc;
            border-radius: 8px;
            text-align: center;
            background: #fff;
            transition: all 0.3s ease;
        }

        .upload-box:hover {
            border-color: var(--primary-color);
            background: #f9fafb;
        }

        .upload-btn {
            margin-top: 1rem;
            padding: 0.5rem 1rem;
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 1rem;
        }

        /* 游戏界面 */
        #game-screen {
            width: 100%;
            height: 100%;
            position: relative;
            background-size: cover;
            background-position: center;
            transition: background-image 0.5s ease-in-out;
        }

        #background-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-size: cover;
            background-position: center;
            z-index: 0;
            transition: opacity 0.5s ease;
        }

        #characters-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
            display: flex;
            justify-content: center;
            align-items: flex-end;
        }

        .character-sprite {
            position: absolute;
            bottom: 0;
            max-height: 90%;
            transition: all 0.3s ease;
            filter: drop-shadow(0 0 10px rgba(0,0,0,0.3));
            /* ✅ 初始状态：不可见 + 左侧偏移 */
            opacity: 0;
            transform: translateX(-100px);
            /* ✅ 去除白色背景 */
            mix-blend-mode: darken;
        }
        
        /* ✅ 动画效果：渐入 + 从左侧滑入 */
        .character-sprite.show {
            animation: characterFadeIn 0.5s ease-out forwards;
        }
        
        @keyframes characterFadeIn {
            from {
                opacity: 0;
                transform: translateX(-100px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }
        
        /* ✅ 退出动画 */
        .character-sprite.hide {
            animation: characterFadeOut 0.5s ease-in forwards;
        }
        
        @keyframes characterFadeOut {
            from {
                opacity: 1;
                transform: translateX(0);
            }
            to {
                opacity: 0;
                transform: translateX(-100px);
            }
        }

        /* 对话框 */
        #ui-layer {
            position: absolute;
            bottom: 2rem;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            max-width: 1000px;
            z-index: 10;
        }

        .dialogue-box {
            background: var(--box-bg);
            border-radius: 12px;
            padding: 1.5rem 2rem;
            color: white;
            min-height: 160px;
            position: relative;
            border: 1px solid rgba(255,255,255,0.1);
            cursor: pointer;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            user-select: none;
        }

        .name-tag {
            position: absolute;
            top: -1.2rem;
            left: 2rem;
            background: var(--name-bg);
            padding: 0.4rem 1.2rem;
            padding-left: 3.5rem; /* ✅ 为头像留出空间 */
            border-radius: 4px;
            font-weight: bold;
            font-size: 1.1rem;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
            display: flex;
            align-items: center;
        }
        
        /* ✅ 新增: 头像样式 */
        .name-tag-avatar {
            position: absolute;
            left: 0.4rem;
            top: 50%;
            transform: translateY(-50%);
            width: 2.5rem;
            height: 2.5rem;
            border-radius: 50%;
            border: 2px solid white;
            object-fit: cover;
            background: rgba(255,255,255,0.2);
        }

        .text-content {
            font-size: 1.2rem;
            line-height: 1.6;
            margin-top: 0.5rem;
            white-space: pre-wrap;
        }

        .next-indicator {
            position: absolute;
            bottom: 1rem;
            right: 1.5rem;
            animation: bounce 1s infinite;
            font-size: 0.8rem;
            opacity: 0.7;
        }

        /* 选项 */
        #choices-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.4);
            z-index: 20;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 1rem;
        }

        .choice-btn {
            background: rgba(255, 255, 255, 0.95);
            color: #333;
            padding: 1rem 2rem;
            min-width: 300px;
            border: none;
            border-radius: 8px;
            font-size: 1.1rem;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
        }

        .choice-btn:hover {
            transform: translateY(-2px);
            background: white;
            box-shadow: 0 6px 12px rgba(0,0,0,0.3);
            color: var(--primary-color);
        }

        .hidden {
            display: none !important;
        }

        /* 加载中 */
        #loading-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 200;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid #f3f3f3;
            border-top: 4px solid var(--primary-color);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(5px); }
        }
        
        /* 旁白样式 */
        .narration-mode .dialogue-box {
            background: rgba(0, 0, 0, 0.6);
            text-align: center;
            font-style: italic;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .narration-mode .name-tag {
            display: none;
        }
    </style>
</head>
<body>

<div id="app">
    <!-- 加载遮罩 -->
    <div id="loading-overlay" class="hidden">
        <div class="spinner"></div>
    </div>

    <!-- 上传界面 -->
    <div id="upload-screen">
        <div class="upload-box">
            <h2>IntelliVNG 播放器</h2>
            <p style="margin: 1rem 0; color: #666;">请上传 .vng.json 游戏文件</p>
            <input type="file" id="file-input" accept=".json" style="display: none">
            <button class="upload-btn" onclick="document.getElementById('file-input').click()">选择文件</button>
        </div>
    </div>

    <!-- 游戏界面 -->
    <div id="game-screen" class="hidden">
        <div id="background-layer"></div>
        <div id="characters-layer"></div>
        
        <div id="ui-layer">
            <div id="dialogue-box" class="dialogue-box" onclick="game.next()">
                <div id="name-tag" class="name-tag">
                    <!-- ✅ 新增: 头像 -->
                    <img id="name-tag-avatar" class="name-tag-avatar" style="display: none;" />
                    <span id="name-tag-text"></span>
                </div>
                <div id="text-content" class="text-content"></div>
                <div class="next-indicator">▼ 点击继续</div>
            </div>
        </div>

        <div id="choices-overlay" class="hidden">
            <!-- 选项按钮将动态生成在这里 -->
        </div>
    </div>
</div>

<!-- 内嵌游戏数据占位符 -->
<script id="game-data" type="application/json">
null
</script>

<script>
    class GamePlayer {
        constructor() {
            this.project = null;
            this.currentNode = null;
            this.currentDialogueIndex = -1;
            this.characterMap = new Map(); // id -> Character
            
            // DOM Elements
            this.screens = {
                upload: document.getElementById('upload-screen'),
                game: document.getElementById('game-screen'),
                loading: document.getElementById('loading-overlay')
            };
            this.layers = {
                background: document.getElementById('background-layer'),
                characters: document.getElementById('characters-layer'),
                ui: document.getElementById('ui-layer'),
                choices: document.getElementById('choices-overlay')
            };
            this.dialogueBox = {
                container: document.getElementById('dialogue-box'),
                nameTag: document.getElementById('name-tag'),
                text: document.getElementById('text-content')
            };

            this.init();
        }

        init() {
            this.initEventListeners();
            this.checkEmbeddedData();
        }

        initEventListeners() {
            const fileInput = document.getElementById('file-input');
            fileInput.addEventListener('change', (e) => this.handleFileUpload(e));

            // 键盘支持
            document.addEventListener('keydown', (e) => {
                if (e.code === 'Space' || e.code === 'Enter') {
                    if (!this.screens.game.classList.contains('hidden') && 
                         this.layers.choices.classList.contains('hidden')) {
                        this.next();
                    }
                }
            });
        }

        checkEmbeddedData() {
            try {
                const scriptTag = document.getElementById('game-data');
                if (scriptTag && scriptTag.textContent.trim() !== 'null') {
                    console.log('Found embedded game data');
                    const project = JSON.parse(scriptTag.textContent);
                    this.loadProject(project);
                }
            } catch (e) {
                console.error('Failed to parse embedded game data:', e);
            }
        }

        async handleFileUpload(event) {
            const file = event.target.files[0];
            if (!file) return;

            this.screens.loading.classList.remove('hidden');
            try {
                const text = await file.text();
                const project = JSON.parse(text);
                this.loadProject(project);
            } catch (err) {
                alert('无法解析项目文件: ' + err.message);
                console.error(err);
            } finally {
                this.screens.loading.classList.add('hidden');
            }
        }

        loadProject(project) {
            console.log('Loading project:', project);
            this.project = project;
            
            // 构建角色映射
            this.characterMap.clear();
            project.characters.forEach(char => {
                this.characterMap.set(char.id, char);
            });

            // 切换界面
            this.screens.upload.classList.add('hidden');
            this.screens.game.classList.remove('hidden');

            // 查找开始节点
            const startNode = project.script.find(n => n.isStart) || project.script[0];
            if (startNode) {
                this.playNode(startNode.id);
            } else {
                alert('未找到开始节点');
            }
        }

        playNode(nodeId) {
            const node = this.project.script.find(n => n.id === nodeId);
            if (!node) {
                console.error('Node not found:', nodeId);
                return;
            }

            console.log('Playing node:', node);
            this.currentNode = node;
            this.currentDialogueIndex = -1;

            // 1. 更新场景背景
            this.updateBackground(node);
            
            // 2. 更新角色立绘
            this.updateCharacters(node);

            // 3. 开始对话或显示旁白
            this.layers.choices.classList.add('hidden');
            
            // 如果有旁白且作为独立内容，先显示旁白
            // 这里简化处理：如果有 dialogues，先播放 dialogues。
            // 可以在对话前或后处理 choices。
            
            this.next();
        }

        updateBackground(node) {
            let bgUrl = '';
            
            // 优先使用节点定义的背景
            if (node.visualAssets?.backgroundImageUrl) {
                bgUrl = node.visualAssets.backgroundImageUrl;
            } 
            // 其次查找 backgroundId
            else if (node.backgroundId) {
                const bg = this.project.backgrounds.find(b => b.id === node.backgroundId);
                if (bg) bgUrl = bg.imageUrl;  // ✅ 修复: 使用 imageUrl 而不是 url
            }
            // 再次尝试通过 sceneName 查找
            else if (node.sceneName) {
                const bg = this.project.backgrounds.find(b => b.name === node.sceneName);
                if (bg) bgUrl = bg.imageUrl;
            }

            console.log('[updateBackground]', {
                nodeId: node.id,
                nodeTitle: node.title,
                hasVisualAssets: !!node.visualAssets?.backgroundImageUrl,
                backgroundId: node.backgroundId,
                sceneName: node.sceneName,
                foundBgUrl: bgUrl,
                projectBackgrounds: this.project.backgrounds?.length
            });

            if (bgUrl) {
                this.layers.background.style.backgroundImage = `url('${bgUrl}')`;
            } else {
                console.warn('[updateBackground] 未找到背景图,使用默认颜色');
                this.layers.background.style.backgroundColor = '#333'; // 默认背景
                this.layers.background.style.backgroundImage = 'none';
            }
        }

        updateCharacters(node) {
            // ✅ 不再自动显示所有角色，只是清空舞台准备
            console.log('[updateCharacters] 准备场景，等待角色出场');
            // 清空当前舞台
            this.clearCharacters();
        }
        
        // ✅ 清空舞台上的所有角色（带退出动画）
        clearCharacters() {
            const existingCharacters = this.layers.characters.querySelectorAll('.character-sprite');
            if (existingCharacters.length > 0) {
                existingCharacters.forEach(img => {
                    img.classList.remove('show');
                    img.classList.add('hide');
                });
                
                setTimeout(() => {
                    this.layers.characters.innerHTML = '';
                }, 500);
            }
        }
        
        // ✅ 显示指定角色的立绘（按需调用）
        showCharacterSprite(characterId) {
            // 检查角色是否已经在舞台上
            const existingSprite = this.layers.characters.querySelector(`[data-character-id="${characterId}"]`);
            if (existingSprite) {
                console.log('[showCharacterSprite] 角色已在舞台上:', characterId);
                return; // 已存在，不重复添加
            }
            
            // ✅ 清除其他角色（保持舞台上只有当前说话者）
            const allSprites = this.layers.characters.querySelectorAll('.character-sprite');
            allSprites.forEach(img => {
                const spriteCharId = img.getAttribute('data-character-id');
                if (spriteCharId !== characterId) {
                    img.classList.remove('show');
                    img.classList.add('hide');
                    // 动画结束后移除
                    setTimeout(() => {
                        if (img.parentNode) img.remove();
                    }, 500);
                }
            });
            
            const char = this.characterMap.get(characterId);
            if (!char) {
                console.warn('[showCharacterSprite] 未找到角色:', characterId);
                return;
            }
            
            // 获取立绘URL
            let spriteUrl;
            if (char.defaultSpriteId) {
                const sprite = char.sprites?.find(s => s.id === char.defaultSpriteId);
                if (sprite) spriteUrl = sprite.imageUrl;
            }
            if (!spriteUrl && char.sprites && char.sprites.length > 0) {
                spriteUrl = char.sprites[0].imageUrl;
            }
            
            if (!spriteUrl) {
                console.warn('[showCharacterSprite] 角色没有立绘:', char.displayName || char.name);
                return;
            }
            
            console.log('[showCharacterSprite] 显示角色立绘:', {
                characterId,
                characterName: char.displayName || char.name,
                spriteUrl
            });
            
            const img = document.createElement('img');
            img.src = spriteUrl;
            img.className = 'character-sprite';
            img.setAttribute('data-character-id', characterId); // ✅ 标记角色ID
            
            // 居中显示
            img.style.left = '50%';
            
            this.layers.characters.appendChild(img);
            
            // ✅ 延迟触发入场动画
            requestAnimationFrame(() => {
                img.classList.add('show');
                img.addEventListener('animationend', () => {
                    img.style.transform = `translateX(-50%)`;
                    img.style.opacity = '1';
                }, { once: true });
            });
        }

        next() {
            // 检查是否有选项显示中
            if (!this.layers.choices.classList.contains('hidden')) return;

            const dialogues = this.currentNode.dialogues || [];
            
            // 增加索引
            this.currentDialogueIndex++;

            // 检查是否还有对话
            if (this.currentDialogueIndex < dialogues.length) {
                const dialogue = dialogues[this.currentDialogueIndex];
                this.renderDialogue(dialogue);
            } else {
                // 对话结束，检查分支或跳转
                this.handleNodeEnd();
            }
        }

        renderDialogue(dialogue) {
            const char = this.characterMap.get(dialogue.characterId);
            const name = char ? (char.displayName || char.name) : '???';
            const text = dialogue.text;
            const avatarUrl = char?.avatarUrl;

            console.log('[renderDialogue]', {
                characterId: dialogue.characterId,
                name,
                hasAvatar: !!avatarUrl,
                avatarUrl
            });
            
            // ✅ 如果不是旁白，显示角色立绘
            if (dialogue.characterId && dialogue.characterId !== 'narrator') {
                this.showCharacterSprite(dialogue.characterId);
            } else {
                // 旁白时清空所有立绘
                this.clearCharacters();
            }

            // 显示 UI
            this.layers.ui.classList.remove('hidden');
            this.dialogueBox.container.classList.remove('narration-mode');
            this.dialogueBox.nameTag.style.display = 'block';
            
            // ✅ 更新头像
            const avatarEl = document.getElementById('name-tag-avatar');
            const nameTextEl = document.getElementById('name-tag-text');
            
            if (avatarUrl) {
                avatarEl.src = avatarUrl;
                avatarEl.style.display = 'block';
            } else {
                avatarEl.style.display = 'none';
            }
            
            // 更新内容
            nameTextEl.textContent = name;
            this.dialogueBox.text.textContent = text;
        }

        handleNodeEnd() {
            const node = this.currentNode;

            // 1. 检查是否有分支选项 (branch 类型且有 choices)
            if (node.type === 'branch' && node.choices && node.choices.length > 0) {
                this.showChoices(node.choices);
                return;
            }
            
            // 2. 检查是否有 nextNodeId (scene 类型通常有)
            if (node.nextNodeId) {
                this.playNode(node.nextNodeId);
                return;
            }
            
            // 3. 检查是否是结局
            if (node.type === 'ending' || node.isEnding) {
                alert('游戏结束');
                // 可以选择重置或留在当前画面
                return;
            }

            // 如果都没有，尝试根据 choices 显示（有些旧数据可能混用）
            if (node.choices && node.choices.length > 0) {
                this.showChoices(node.choices);
                return;
            }

            console.warn('No next node or choices found. End of script?');
        }

        showChoices(choices) {
            this.layers.choices.innerHTML = '';
            this.layers.choices.classList.remove('hidden');
            
            // 隐藏对话框
            this.layers.ui.classList.add('hidden');

            choices.forEach(choice => {
                const btn = document.createElement('button');
                btn.className = 'choice-btn';
                btn.textContent = choice.text;
                btn.onclick = () => {
                    this.playNode(choice.targetNodeId);
                };
                this.layers.choices.appendChild(btn);
            });
        }
    }

    // 初始化游戏
    const game = new GamePlayer();
</script>
</body>
</html>
